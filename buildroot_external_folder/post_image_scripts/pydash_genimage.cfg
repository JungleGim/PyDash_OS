//based on CM4io-64 generated genimage in the <buildroot>/output/images/ dir
image boot.vfat {
	vfat {
		files = {
			"bcm2711-rpi-cm4.dtb",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/overlays",
			"rpi-firmware/start4.elf",
			"Image",	
		}
	}

	size = 32M
}

//1Gb ext4 image to be created and mounted for pydash userspace
image pydash_userspace.ext4 {
	vfat {
		label = "pydash_user"
	}
	//add files in with srcpath
	srcpath = "/home/john/buildroot/cm4_pydash/userspace_default_files"
	size = 200M	
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
	
	//add new partition for user space and USB device
	partition pydash_user {
		partition-type = 0xC
		image = pydash_userspace.ext4		
	}
}
